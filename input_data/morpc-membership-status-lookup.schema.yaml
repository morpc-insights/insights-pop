# Reference: https://specs.frictionlessdata.io//table-schema/
fields:
  - name: GEOIDFQ
    type: string
    description: Fully-qualifed geographic identifier for the jurisdiction county part (SUMLEVEL M11).  See morpc-geos-collect for more information.
  - name: YEAR
    type: integer
    description: The four-digit year for which the membership status applies.  Indicates membership status used for assessment of dues. Does not capture cases when communities joined later in the year after dues were determined.
  - name: COUNTY
    type: string
    description: The name of the county where the jurisdiction part is located
  - name: NAME
    type: string
    description: The name of the jurisdiction
  - name: MUNITYPE
    type: string
    description: Type of municipality (City, Village, or Township)
  - name: MEMBERCLASSINDIV
    type: string
    description: The membership class that applies to or would apply to the individual jurisdication (MPO or RPC) regardless of whether the jurisdiction is an active member
  - name: MEMBERCLASSCOUNTY
    type: string
    description: The membership class that applies to or would apply to the jurisdiction part by virtue of the county in which it is located (MPO, CORPO, or RPC) regardless of whether the county is an active member
  - name: MEMBERINDIV
    type: boolean
    description: TRUE if the jurisdiction is an active MORPC member on an individual basis. FALSE otherwise.
    trueValues: ["TRUE"]
    falseValues: ["FALSE"]
  - name: MEMBERCOUNTY
    type: boolean
    description: TRUE if the county in which the jurisdiction part is located is an active MORPC member. FALSE otherwise.
    trueValues: ["TRUE"]
    falseValues: ["FALSE"]
missingValues:
  - ''
primaryKey:
  - GEOIDFQ
  - YEAR



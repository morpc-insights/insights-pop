title: MORPC membership status for Central Ohio governments
description: This table identifies the MORPC membership status for all local governments
  in Central Ohio, as well as their participation in the Metropolitan Planning Organization
  (MPO), Central Ohio Rural Planning Organization (CORPO), or the Regional Planning
